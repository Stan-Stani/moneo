<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>audit_kit reviewer</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body {
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, Helvetica, sans-serif;
  background:#0f1217; color:#dde2ec; margin:0; padding:0;
  display:flex; flex-direction:column; height:100vh;
}
header { padding:12px 18px; background:#161b22; border-bottom:1px solid #2a323e; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
header h1 { margin:0; font-size:17px; font-weight:600; }
header .stats { margin-left:auto; color:#8b95a6; font-size:14px; }
header label { display:inline-flex; align-items:center; gap:4px; color:#8b95a6; cursor:pointer; }
header input[type=file] { display:none; }
header .btn {
  padding:7px 12px; background:#2a3140; border:1px solid #3a4453; border-radius:4px;
  color:#dde2ec; cursor:pointer; font-size:14px;
}
header .btn:hover { background:#36405a; }
header .btn.primary { background:#2d5fb3; border-color:#3c7fdc; }
header .btn.primary:hover { background:#3a72cf; }

main { flex:1; display:flex; min-height:0; }
#list {
  width:400px; min-width:280px; border-right:1px solid #2a323e;
  overflow-y:auto; background:#10141b;
}
.row { padding:10px 12px; border-bottom:1px solid #1d242f; cursor:pointer; }
.row:hover { background:#1a212c; }
.row.active { background:#1f2a3a; }
.row .key { font-family:ui-monospace,Menlo,monospace; font-size:13px; color:#8b95a6; }
.row .ko { color:#e9eef7; margin-top:3px; font-size:15px; }
.row .verdict { display:inline-block; padding:2px 7px; border-radius:3px; font-size:12px; margin-top:4px; }
.v-mistranslation,.v-wrong_gloss { background:#542; color:#fcb; }
.v-unnatural,.v-wrong_collocation { background:#454; color:#cfc; }
.v-ungrammatical,.v-wrong_inflection { background:#544; color:#fcc; }
.v-redundant,.v-spacing,.v-editorial_artifact { background:#345; color:#cdf; }
.v-uncertain,.v-ambiguous { background:#444; color:#dde; }
.v-pos_mismatch,.v-wrong_pos,.v-target_form_drift { background:#523; color:#fcc; }
.v-missing_sense,.v-incomplete_gloss { background:#445; color:#ccf; }
.row .action-chip { float:right; padding:2px 7px; border-radius:3px; font-size:12px; }
.a-accept { background:#16431e; color:#9fdcb1; }
.a-reject { background:#451817; color:#dc9c9b; }
.a-edit   { background:#3a3617; color:#dcd09c; }
.a-defer  { background:#2a3140; color:#8b95a6; }

#detail { flex:1; overflow-y:auto; padding:22px 26px; }
#detail h2 { margin:0 0 10px; font-size:20px; }
#detail .meta { color:#8b95a6; font-size:14px; margin-bottom:16px; }
#detail .field { margin-bottom:14px; }
#detail .field-label { color:#8b95a6; font-size:13px; text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; }
#detail .diff { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
#detail .diff .pane {
  background:#161b22; border:1px solid #2a323e; border-radius:4px;
  padding:10px 12px; min-height:46px; white-space:pre-wrap; word-break:break-word;
  font-size:15px; line-height:1.5;
}
#detail .diff .pane.original { border-left:3px solid #6b3636; }
#detail .diff .pane.proposed { border-left:3px solid #3a6b3a; }
#detail .issue {
  background:#161b22; border:1px solid #2a323e; border-radius:4px;
  padding:12px 14px; white-space:pre-wrap; font-size:15px; line-height:1.5;
}
#detail .evidence { font-size:15px; }
#detail .evidence a { color:#7dafff; }
#detail textarea {
  width:100%; min-height:70px; background:#10141b; color:#dde2ec;
  border:1px solid #2a323e; border-radius:4px; padding:8px 10px;
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, Helvetica, sans-serif;
}
#detail .actions { display:flex; gap:10px; margin-top:18px; }
#detail .actions button {
  padding:8px 18px; border-radius:4px; border:1px solid #3a4453;
  background:#2a3140; color:#dde2ec; cursor:pointer; font-size:15px;
}
#detail .actions button:hover { background:#36405a; }
#detail .actions button.active { outline:2px solid #3c7fdc; }
#detail .note { margin-top:10px; }
#empty { color:#566472; text-align:center; padding:60px 20px; font-size:15px; }
.filter-bar { padding:10px 12px; border-bottom:1px solid #2a323e; background:#10141b; display:flex; gap:8px; }
.filter-bar input { flex:1; padding:6px 10px; background:#161b22; border:1px solid #2a323e; color:#dde2ec; border-radius:3px; font-size:14px; }
.filter-bar select { padding:6px 8px; background:#161b22; border:1px solid #2a323e; color:#dde2ec; border-radius:3px; font-size:14px; }
</style>
</head>
<body>

<header>
  <h1>audit_kit reviewer</h1>
  <label class="btn">Load apply-list.json<input type="file" id="loadApply" accept=".json"></label>
  <label class="btn">Load decisions.json (resume)<input type="file" id="loadDecisions" accept=".json"></label>
  <button class="btn" id="reviewerNameBtn">Reviewer: <span id="reviewerName">anonymous</span></button>
  <button class="btn primary" id="exportBtn">Export decisions.json</button>
  <div class="stats" id="stats">no apply-list loaded</div>
</header>

<main>
  <div id="list">
    <div class="filter-bar">
      <input id="filter" placeholder="filter by key / korean / issue">
      <select id="verdictFilter"><option value="">all verdicts</option></select>
      <select id="actionFilter">
        <option value="">all states</option>
        <option value="pending">undecided</option>
        <option value="accept">accept</option>
        <option value="reject">reject</option>
        <option value="edit">edit</option>
        <option value="defer">defer</option>
      </select>
    </div>
    <div id="rows"></div>
  </div>

  <div id="detail">
    <div id="empty">Load an apply-list.json to start.<br><br>
    Keyboard: <b>j</b>/<b>k</b> next/prev, <b>a</b> accept, <b>r</b> reject, <b>e</b> edit, <b>d</b> defer.</div>
  </div>
</main>

<script>
const state = {
  flags: [],          // from apply-list.json
  decisions: {},      // key -> {action, override?, note?}
  selected: null,
  reviewer: localStorage.getItem("audit_kit_reviewer") || "anonymous",
  preset: null,
};

document.getElementById("reviewerName").textContent = state.reviewer;
document.getElementById("reviewerNameBtn").onclick = () => {
  const n = prompt("Reviewer name", state.reviewer);
  if (n) { state.reviewer = n; localStorage.setItem("audit_kit_reviewer", n); document.getElementById("reviewerName").textContent = n; }
};

function readJSON(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => { try { res(JSON.parse(e.target.result)); } catch (err) { rej(err); } };
    r.onerror = () => rej(r.error);
    r.readAsText(file);
  });
}

function ingestApply(doc) {
  state.flags = doc.applyList || [];
  state.preset = doc.preset || null;
  populateVerdicts();
  render();
}

function ingestDecisions(doc) {
  state.decisions = {};
  (doc.decisions || []).forEach(d => state.decisions[d.key] = d);
  if (doc.reviewer && !localStorage.getItem("audit_kit_reviewer")) {
    state.reviewer = doc.reviewer;
    document.getElementById("reviewerName").textContent = state.reviewer;
  }
  render();
}

document.getElementById("loadApply").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  ingestApply(await readJSON(f));
};

document.getElementById("loadDecisions").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  ingestDecisions(await readJSON(f));
};

// Query-string bootstrap: ?apply-list=/path/to/apply-list.json[&decisions=/path/to/decisions.json]
(async () => {
  const params = new URLSearchParams(location.search);
  const applyUrl = params.get("apply-list");
  const decisionsUrl = params.get("decisions");
  if (applyUrl) {
    try {
      const r = await fetch(applyUrl); ingestApply(await r.json());
    } catch (err) {
      console.error("failed to load apply-list", err);
      document.getElementById("stats").textContent = `failed to load ${applyUrl}: ${err.message}`;
    }
  }
  if (decisionsUrl) {
    try {
      const r = await fetch(decisionsUrl); ingestDecisions(await r.json());
    } catch (err) { console.error("failed to load decisions", err); }
  }
})();

function populateVerdicts() {
  const sel = document.getElementById("verdictFilter");
  const verdicts = [...new Set(state.flags.map(f => f.verdict))].sort();
  sel.innerHTML = '<option value="">all verdicts</option>' +
    verdicts.map(v => `<option value="${v}">${v}</option>`).join("");
}

function filtered() {
  const q = document.getElementById("filter").value.toLowerCase();
  const v = document.getElementById("verdictFilter").value;
  const a = document.getElementById("actionFilter").value;
  return state.flags.filter(f => {
    if (v && f.verdict !== v) return false;
    const d = state.decisions[f.key];
    const action = d ? d.action : "pending";
    if (a && action !== a) return false;
    if (q) {
      const hay = (f.key + " " + (f.issue||"") + " " + JSON.stringify(f.originalValue||{}) + " " + JSON.stringify(f.proposedValue||{})).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function render() {
  const rows = document.getElementById("rows");
  const list = filtered();
  rows.innerHTML = list.map((f, i) => {
    const d = state.decisions[f.key];
    const action = d ? d.action : null;
    const orig = f.originalValue || {};
    const ko = orig.korean || orig.gloss || "(no original snapshot)";
    return `<div class="row ${state.selected === f.key ? "active" : ""}" data-key="${escapeAttr(f.key)}">
      <div class="key">${escapeHtml(f.key)}${action ? `<span class="action-chip a-${action}">${action}</span>` : ""}</div>
      <div class="ko">${escapeHtml(truncate(ko, 90))}</div>
      <span class="verdict v-${f.verdict}">${f.verdict}</span>
    </div>`;
  }).join("") || `<div style="padding:20px;color:#566472">no flags match</div>`;
  rows.querySelectorAll(".row").forEach(r => r.onclick = () => select(r.dataset.key));
  updateStats();
  if (state.selected) renderDetail(state.flags.find(f => f.key === state.selected));
}

function updateStats() {
  const total = state.flags.length;
  const counts = { accept:0, reject:0, edit:0, defer:0, pending:0 };
  state.flags.forEach(f => {
    const d = state.decisions[f.key];
    counts[d ? d.action : "pending"]++;
  });
  document.getElementById("stats").textContent =
    `${total} flags · ${counts.accept}A / ${counts.reject}R / ${counts.edit}E / ${counts.defer}D / ${counts.pending} undecided` +
    (state.preset ? ` · preset: ${state.preset}` : "");
}

function select(key) {
  state.selected = key;
  render();
}

function renderDetail(f) {
  if (!f) return;
  const orig = f.originalValue || {};
  const prop = f.proposedValue || {};
  const fields = new Set([...Object.keys(orig), ...Object.keys(prop)]);
  const decision = state.decisions[f.key] || {};
  const override = decision.override || {};

  const diffRows = [...fields].map(field => `
    <div class="field">
      <div class="field-label">${escapeHtml(field)}</div>
      <div class="diff">
        <div class="pane original">${escapeHtml(orig[field] ?? "")}</div>
        <div class="pane proposed" contenteditable="true" data-field="${escapeAttr(field)}">${escapeHtml(override[field] ?? prop[field] ?? "")}</div>
      </div>
    </div>
  `).join("");

  const ev = f.evidence || {};
  const evHtml = ev.type === "url"
    ? `<a href="${escapeAttr(ev.value)}" target="_blank" rel="noopener">${escapeHtml(ev.value)}</a>`
    : `<b>${escapeHtml(ev.type || "?")}:</b> ${escapeHtml(ev.value || "")}`;

  document.getElementById("detail").innerHTML = `
    <h2>${escapeHtml(f.key)}</h2>
    <div class="meta">
      <span class="verdict v-${f.verdict}">${f.verdict}</span>
      &nbsp; auditor: ${escapeHtml(f.auditor || "?")}
      ${f.hadPriorAuditFix ? '&nbsp; <b style="color:#d8b86a">prior auditFix</b>' : ""}
      ${f.sourceShard ? `&nbsp; <span style="color:#566472">${escapeHtml(f.sourceShard)}</span>` : ""}
    </div>

    <div class="field">
      <div class="field-label">issue</div>
      <div class="issue">${escapeHtml(f.issue || "")}</div>
    </div>

    <div class="field">
      <div class="field-label">evidence</div>
      <div class="evidence">${evHtml}${ev.note ? `<div style="color:#8b95a6;margin-top:3px">${escapeHtml(ev.note)}</div>` : ""}</div>
    </div>

    ${f.suggestion ? `<div class="field"><div class="field-label">suggestion (prose)</div><div class="issue">${escapeHtml(f.suggestion)}</div></div>` : ""}

    <div class="field-label" style="margin-top:8px">original → proposed (edit the right pane to override)</div>
    ${diffRows || '<div style="color:#566472">no structured field snapshot — use the prose suggestion above</div>'}

    <textarea id="noteField" class="note" placeholder="reviewer note (optional)">${escapeHtml(decision.note || "")}</textarea>

    <div class="actions">
      <button id="btnAccept" class="${decision.action==='accept'?'active':''}">accept (a)</button>
      <button id="btnEdit"   class="${decision.action==='edit'?'active':''}">edit (e)</button>
      <button id="btnReject" class="${decision.action==='reject'?'active':''}">reject (r)</button>
      <button id="btnDefer"  class="${decision.action==='defer'?'active':''}">defer (d)</button>
    </div>
  `;

  document.getElementById("btnAccept").onclick = () => decide(f, "accept");
  document.getElementById("btnEdit").onclick   = () => decide(f, "edit");
  document.getElementById("btnReject").onclick = () => decide(f, "reject");
  document.getElementById("btnDefer").onclick  = () => decide(f, "defer");
}

function collectOverride() {
  const out = {};
  document.querySelectorAll("#detail .pane.proposed[contenteditable]").forEach(el => {
    out[el.dataset.field] = el.innerText;
  });
  return out;
}

function decide(f, action) {
  const note = document.getElementById("noteField")?.value || "";
  const dec = { key: f.key, action };
  if (action === "edit") dec.override = collectOverride();
  if (note.trim()) dec.note = note.trim();
  state.decisions[f.key] = dec;
  render();
}

document.getElementById("exportBtn").onclick = () => {
  const doc = {
    preset: state.preset,
    reviewer: state.reviewer,
    reviewedAt: new Date().toISOString().slice(0, 10),
    decisions: Object.values(state.decisions),
  };
  const blob = new Blob([JSON.stringify(doc, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "decisions.json";
  a.click();
};

document.getElementById("filter").oninput = render;
document.getElementById("verdictFilter").onchange = render;
document.getElementById("actionFilter").onchange = render;

document.addEventListener("keydown", e => {
  if (["INPUT","TEXTAREA"].includes(document.activeElement.tagName)) return;
  if (document.activeElement?.isContentEditable) return;
  const list = filtered();
  const idx = state.selected ? list.findIndex(f => f.key === state.selected) : -1;
  if (e.key === "j") { const n = list[Math.min(list.length-1, idx+1)]; if (n) select(n.key); }
  else if (e.key === "k") { const n = list[Math.max(0, idx-1)]; if (n) select(n.key); }
  else if (state.selected) {
    const f = state.flags.find(x => x.key === state.selected); if (!f) return;
    if (e.key === "a") decide(f, "accept");
    else if (e.key === "r") decide(f, "reject");
    else if (e.key === "e") decide(f, "edit");
    else if (e.key === "d") decide(f, "defer");
  }
});

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, "&#96;"); }
function truncate(s, n) { s = String(s ?? ""); return s.length > n ? s.slice(0, n-1) + "…" : s; }
</script>
</body>
</html>
